[package]
name = "bred"
version = "0.1.2"
description = "БРЕД — Быстрая Ретрансляция Электронных Данных"
edition = "2021"
rust-version = "1.82"

[lib]
name = "bred_lib"
# staticlib нужен только для мобильных целей: на десктопе это лишние
# сотни мегабайт в каждой сборке.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
bytes = "1.12.1"
chacha20poly1305 = "0.10.1"
data-encoding = "2.11.0"
iroh = "1"
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
n0-future = "0.3"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9.5"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tauri = { version = "2" }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
