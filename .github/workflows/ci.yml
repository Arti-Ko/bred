# Проверки на каждый push и pull request.
#
# Тесты гоняем на Linux: они не трогают ни камеру, ни микрофон, ни окно, и им
# достаточно любой машины. Но с появлением общего плеера у нас есть код, который
# на Linux не компилируется вовсе — захват звука приложения написан отдельно под
# каждую систему. Поэтому рядом идут короткие проверки на macOS и Windows: без
# них поломка в платформенном модуле всплыла бы только на сборке релиза, то есть
# после тега, когда исправлять уже поздно.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Системные зависимости webkit нужны даже для проверки типов Rust:
      # крейт tauri без них не собирается.
      - name: Зависимости системы
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Только проверка компиляции: полная сборка нужна лишь релизу, а поймать
  # неверную привязку к системному API она успевает и так.
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    name: Платформенный код — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      # Интерфейс собирать незачем, но tauri ждёт каталог сборки на месте.
      - run: mkdir dist

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
