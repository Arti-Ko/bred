# Сборка релиза БРЕД под macOS и Windows.
#
# Запускается по тегу вида v0.1.0. Артефакты подписываются ключом обновлений,
# приватная половина которого лежит в секретах — в репозитории её нет и быть
# не должно. Рядом с файлами публикуется latest.json, за которым ходит
# встроенная проверка обновлений.

name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Сборка iroh и tauri занимает минуты — без кеша каждый релиз стоил бы
      # десятков минут на каждую платформу.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Проверки перед сборкой
        run: |
          pnpm check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: БРЕД ${{ github.ref_name }}
          releaseBody: |
            Мессенджер без сервера.

            Скачайте файл под свою систему. Обновления дальше приезжают сами —
            проверить вручную можно в настройках (^,).
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
