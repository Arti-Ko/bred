# Сборка релиза БРЕД под macOS и Windows.
#
# Запускается по тегу вида v0.1.0. Артефакты подписываются ключом обновлений,
# приватная половина которого лежит в секретах — в репозитории её нет и быть
# не должно. Рядом с файлами публикуется latest.json, за которым ходит
# встроенная проверка обновлений.

name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Сборка iroh и tauri занимает минуты — без кеша каждый релиз стоил бы
      # десятков минут на каждую платформу.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Проверки перед сборкой
        run: |
          pnpm check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: БРЕД ${{ github.ref_name }}
          releaseBody: |
            Мессенджер без сервера.

            Скачайте файл под свою систему. Обновления дальше приезжают сами —
            проверить вручную можно в настройках (^,).
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # Манифест обновления собираем отдельным шагом, а не в матрице: три задачи
  # писали бы один и тот же файл наперегонки, и он терялся.
  manifest:
    name: Манифест обновления
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Собрать latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          mkdir manifest && cd manifest
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig'

          # Имена файлов теряют кириллицу из названия приложения, поэтому
          # ищем по суффиксу, а не по полному имени.
          sig() { cat "$(ls | grep -- "$1")"; }
          url() { echo "$BASE/$(ls | grep -- "$1" | sed 's/\.sig$//')"; }

          cat > latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "Подробности — в описании релиза $TAG.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(sig 'aarch64.app.tar.gz.sig')",
                "url": "$(url 'aarch64.app.tar.gz.sig')"
              },
              "darwin-x86_64": {
                "signature": "$(sig 'x64.app.tar.gz.sig')",
                "url": "$(url 'x64.app.tar.gz.sig')"
              },
              "windows-x86_64": {
                "signature": "$(sig 'x64-setup.exe.sig')",
                "url": "$(url 'x64-setup.exe.sig')"
              }
            }
          }
          JSON

          python3 -c "import json,sys; json.load(open('latest.json'))" \
            || { echo 'манифест невалиден'; cat latest.json; exit 1; }

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          echo "манифест опубликован"
